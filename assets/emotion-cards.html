<style>

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans-ko);font-weight:300;-webkit-font-smoothing:antialiased}
header{padding:44px 20px 14px;text-align:center}
header .brand{font:400 30px var(--serif-en);letter-spacing:.42em;padding-left:.42em;color:#4f5d62}
header .sub{margin-top:10px;font:300 13px var(--serif-en);letter-spacing:.34em;padding-left:.34em;text-transform:uppercase;color:#8b8579}
header .sig{margin-top:14px;font:italic 300 19px var(--serif-en);color:#8a7c60;letter-spacing:.05em}
header small{display:block;margin-top:12px;font-size:12px;color:#9a948a}
.bar{position:sticky;top:0;z-index:5;background:rgba(244,239,230,.95);backdrop-filter:blur(6px);padding:12px 16px 10px;border-bottom:1px solid #e0d8ca}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:1100px;margin:0 auto}
.chip{display:flex;align-items:center;gap:6px;border:1px solid #ddd4c4;background:#fbf7ee;border-radius:999px;padding:5px 11px 5px 7px;font:400 12px var(--sans-ko);color:var(--ink);cursor:pointer}
.chip i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.18)}
.chip[aria-pressed="true"]{background:#4f5d62;color:#fff;border-color:#4f5d62}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:10px}
.tools input{width:min(260px,70vw);padding:8px 12px;border:1px solid #ddd4c4;border-radius:10px;font:300 14px var(--sans-ko);background:#fbf7ee}
.btn{border:0;background:#4f5d62;color:#fff;border-radius:10px;padding:9px 14px;font:400 13px var(--sans-ko);cursor:pointer}
.btn.alt{background:#fbf7ee;color:var(--ink);border:1px solid #ddd4c4}
.count{font-size:13px;color:#9a948a}
main{padding:22px 12px 70px;display:flex;flex-wrap:wrap;gap:28px;justify-content:center;max-width:1300px;margin:0 auto}
.sectionTitle{flex:0 0 100%;display:flex;align-items:center;gap:10px;font:400 21px var(--serif-en);letter-spacing:.2em;margin:16px 4px 0;color:#4f5d62}
.sectionTitle i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.2)}
.sectionTitle small{font:300 13px var(--sans-ko);color:#9a948a;letter-spacing:0}

/* ---- 카드: 가로 7cm x 세로 9cm ---- */
.card{width:7cm;height:9cm;perspective:1400px;cursor:pointer;flex:0 0 auto;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:center}
.card:focus-visible{outline:3px solid #8aa6b4;outline-offset:4px;border-radius:14px}
.inner{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:.45cm;border:.14cm solid var(--c);background:var(--hanji),var(--paper);background-size:100% 100%,auto;box-shadow:0 10px 24px rgba(90,70,40,.15);overflow:hidden}
.card.white .face{box-shadow:0 0 0 1px #d6cfc2,0 10px 24px rgba(90,70,40,.13)}
.back{transform:rotateY(180deg)}
.art{position:absolute;inset:0}
.art svg{width:100%;height:100%;display:block}
.topstar{position:absolute;left:50%;top:.78cm;transform:translateX(-50%);width:.55cm;height:.55cm}
.txt{position:absolute;left:0;right:0;top:61%;height:24%;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:0 .6cm}
.ko{font-family:var(--serif-ko);font-weight:500;letter-spacing:.02em;line-height:1.35;color:#2f2d2b;word-break:keep-all;text-wrap:balance}
.en{font:400 10.5px var(--serif-en);letter-spacing:.4em;text-transform:uppercase;color:#6d675f;margin-top:.26cm;padding-left:.4em}
.num{position:absolute;left:0;right:0;bottom:.24cm;font:400 8.5px var(--serif-en);letter-spacing:.28em;color:#a39a88;z-index:2}
/* 뒷면 */
.bstar{position:absolute;left:50%;top:.78cm;transform:translateX(-50%);width:.55cm;height:.55cm}
.bcont{position:absolute;inset:1.55cm .6cm 1.62cm;display:flex;flex-direction:column;align-items:center;text-align:center}
.bcont .en2{font:400 12px var(--serif-en);letter-spacing:.34em;text-transform:uppercase;color:#6d675f;padding-left:.34em}
.bcont .mean{font:italic 300 13px var(--serif-ko);font-style:normal;color:#7a735f;margin-top:.22cm;word-break:keep-all}
.bcont .desc{font:300 11.5px/1.75 var(--sans-ko);margin-top:.3cm;color:#3b3935;word-break:keep-all}
.bcont .rule{width:62%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:.4cm 0 .3cm;flex:0 0 auto}
.bcont .lab{font:400 11px var(--serif-ko);color:#9a8760;letter-spacing:.12em}
.bcont .q{font:300 11.5px/1.75 var(--sans-ko);margin-top:.15cm;color:#3b3935;word-break:keep-all}
.bsprig{position:absolute;left:50%;bottom:.6cm;transform:translateX(-50%);width:1.4cm;height:.75cm}
dialog{border:0;border-radius:18px;padding:22px;background:var(--bg);max-width:96vw}
dialog::backdrop{background:rgba(30,26,20,.5)}
dialog .row{display:flex;gap:10px;justify-content:center;margin-top:14px}
.zoomwrap{display:flex;justify-content:center}
.zoomwrap .card{zoom:1.35}
.empty{padding:60px 0;color:#9a948a}

/* ---- 인쇄: A4 가로, 한 장에 8장(4열 x 2행) ---- */
@media print{
  @page{size:A4 landscape;margin:.5cm}
  body{background:#fff}
  header,.bar,dialog,.sectionTitle{display:none!important}
  main{display:grid;grid-template-columns:repeat(4,7cm);grid-auto-rows:9cm;gap:0;justify-content:center;padding:0;max-width:none}
  .card{break-inside:avoid;perspective:none}
  .inner{transition:none;transform:none!important}
  .back{display:none}
  .face{box-shadow:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card.white .face{box-shadow:0 0 0 1px #bbb!important}
  .art svg{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function blob(r,cx,cy,rad,n,irr){
  const pts=[];for(let i=0;i<n;i++){const a=i/n*6.2832+r()*.3,rr=rad*(1+(r()-.5)*2*irr);pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr])}

  for(let i=0;i<n;i++){const p=pts[i],q=mid(p,pts[(i+1)%n]);d+=`Q${n1(p[0])} ${n1(p[1])} ${n1(q[0])} ${n1(q[1])}`}return d+'Z';
}
function wash(r,f,cx,cy,rad,col,op,irr=.2,n=9,sx=1){
  const d=blob(r,cx,cy,rad,n,irr);

  return `<g${tf} filter="url(#wc${f})"><path d="${d}" fill="${col}" opacity="${op}"/><path d="${d}" fill="none" stroke="${RIM}" stroke-width=".7" opacity=".2"/></g>`;
}

function spiral(cx,cy,a,turns,rot){let d='';for(let t=0;t<=turns*6.283;t+=.25){const rr=a*t;d+=(d?' L':'M')+n1(cx+Math.cos(t+rot)*rr*.9)+' '+n1(cy+Math.sin(t+rot)*rr)}return d}

  s+=`<path d="M0 0 C${n1(-w)} ${n1(-len*.3)} ${n1(-w*.8)} ${n1(-len*.8)} 0 ${-len} C${n1(w*.8)} ${n1(-len*.8)} ${n1(w)} ${n1(-len*.3)} 0 0Z" fill="${col}" fill-opacity=".16" stroke="${col}" stroke-width=".5"/><path d="M0 ${n1(len*.12)} L0 ${-len}" stroke="${col}" stroke-width=".6"/>`;

function branch(x,y,len,rot,col,op,leaves=6){

  for(let k=0;k<leaves;k++){const t=(k+1)/(leaves+1),py=-len*t,px=len*.1*Math.sin(Math.PI*t)*1.0,sd=k%2?1:-1;
    s+=`<ellipse cx="${n1(px+sd*len*.11)}" cy="${n1(py-len*.03)}" rx="${n1(len*.11)}" ry="${n1(len*.04)}" transform="rotate(${-sd*28} ${n1(px)} ${n1(py)})" fill="${col}" fill-opacity=".14"/>`}

/* ================= 카드 만들기 ================= */
function koSize(t){const n=t.replace(/\s/g,'').length;return n<=3?27:n<=5?24:n<=8?21:n<=11?18:n<=15?15.5:14}
const cleanEn=e=>e.replace(/\s*\(.*\)$/,'');
const starSVG=`<svg viewBox="-14 -14 28 28"><path d="${STAR}" fill="url(#gold)"/></svg>`;
const sprigSVG=`<svg viewBox="0 0 70 38" fill="none" stroke="#c6a46a" stroke-width=".7" stroke-linecap="round"><path d="M6 34 Q34 28 62 6"/><g fill="#c6a46a" fill-opacity=".18"><ellipse cx="20" cy="27" rx="7" ry="2.6" transform="rotate(-38 20 27)"/><ellipse cx="28" cy="31" rx="7" ry="2.6" transform="rotate(30 28 31)"/><ellipse cx="38" cy="21" rx="7" ry="2.6" transform="rotate(-48 38 21)"/><ellipse cx="46" cy="26" rx="6.5" ry="2.4" transform="rotate(26 46 26)"/><ellipse cx="54" cy="12" rx="6" ry="2.2" transform="rotate(-55 54 12)"/></g></svg>`;
function cardEl(code,name,idx,it){
  const [en,sk,fk]=it, word=cleanEn(en);
  const key=G[MAP[word]]?MAP[word]:'calm', h=hash(word+code);
  const desc=DESC[key], q=QS[key][h%3];
  const el=document.createElement('button');
  el.type='button'; el.className='card'+(code==='GV'?' white':'');
  el.style.setProperty('--c',COLORS[code]);
  el.dataset.code=code; el.dataset.word=word;
  el.dataset.search=(word+' '+fk+' '+sk).toLowerCase();
  el.setAttribute('aria-label',`${sk} (${word}) 카드, 누르면 뒤집힘`);
  const no=`${code} · ${String(idx).padStart(2,'0')}`;
  el.innerHTML=`<div class="inner">
   <div class="face front"><div class="art"></div><div class="topstar">${starSVG}</div>
     <div class="txt"><div class="ko" style="font-size:${koSize(sk)}px">${sk}</div><div class="en">${en}</div></div>
     <div class="num">${no}</div></div>
   <div class="face back"><div class="bstar">${starSVG}</div>
     <div class="bcont"><div class="en2">${en}</div><div class="mean">${fk}</div><div class="desc">${desc}</div><div class="rule"></div><div class="lab">탐색 질문</div><div class="q">${q}</div></div>
     <div class="bsprig">${sprigSVG}</div><div class="num">${no}</div></div>
  </div>`;
  el.addEventListener('click',()=>el.classList.toggle('flip'));
  return el;
}
function ensureArt(c){const a=c.querySelector('.art');if(a.dataset.done)return;a.dataset.done=1;a.innerHTML=energy(c.dataset.word,c.dataset.code)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){ensureArt(e.target);io.unobserve(e.target)}}),{rootMargin:'700px'});
const grid=document.getElementById('grid'), chips=document.getElementById('chips');
let active=new Set(DATA.map(d=>d.code));
DATA.forEach(d=>{
  const t=document.createElement('div'); t.className='sectionTitle'; t.dataset.code=d.code;
  t.innerHTML=`<i style="background:${COLORS[d.code]}"></i>${d.code} <small>${d.name} · ${d.items.length}장</small>`;
  grid.appendChild(t);
  d.items.forEach((it,i)=>{const c=cardEl(d.code,d.name,i+1,it);grid.appendChild(c);io.observe(c)});
  const b=document.createElement('button'); b.className='chip'; b.setAttribute('aria-pressed','true'); b.dataset.code=d.code;
  b.innerHTML=`<i style="background:${COLORS[d.code]}"></i>${d.code} ${d.name}`;
  b.onclick=()=>{ if(active.has(d.code)){active.delete(d.code)}else{active.add(d.code)}; apply(); };
  chips.appendChild(b);
});
const all=document.createElement('button'); all.className='chip'; all.textContent='전체 선택/해제';
all.onclick=()=>{ active = active.size===DATA.length ? new Set() : new Set(DATA.map(d=>d.code)); apply(); };
chips.prepend(all);
const qEl=document.getElementById('q'), cnt=document.getElementById('count');
function apply(){
  const q=qEl.value.trim().toLowerCase(); let n=0; const vis={};
  grid.querySelectorAll('.card').forEach(c=>{
    const show=active.has(c.dataset.code)&&(!q||c.dataset.search.includes(q));
    c.style.display=show?'':'none'; if(show){n++;vis[c.dataset.code]=1}
  });
  grid.querySelectorAll('.sectionTitle').forEach(t=>t.style.display=vis[t.dataset.code]?'':'none');
  chips.querySelectorAll('.chip[data-code]').forEach(b=>b.setAttribute('aria-pressed',active.has(b.dataset.code)));
  cnt.textContent=n+'장 보는 중';
  let e=document.getElementById('empty');
  if(!n){ if(!e){e=document.createElement('div');e.id='empty';e.className='empty';e.textContent='찾는 카드가 없어요. 다른 말로 검색해 보세요.';grid.appendChild(e)} } else if(e) e.remove();
}
qEl.addEventListener('input',apply);
let flipped=false;
document.getElementById('allFlip').onclick=()=>{flipped=!flipped;grid.querySelectorAll('.card').forEach(c=>c.classList.toggle('flip',flipped))};
const dlg=document.getElementById('dlg'), zoom=document.getElementById('zoom');
function draw(){
  const pool=[...grid.querySelectorAll('.card')].filter(c=>c.style.display!=='none');
  if(!pool.length) return;
  const src=pool[Math.floor(Math.random()*pool.length)]; ensureArt(src);
  const clone=src.cloneNode(true); clone.classList.remove('flip');
  clone.addEventListener('click',()=>clone.classList.toggle('flip'));
  zoom.replaceChildren(clone);
  if(!dlg.open){ try{dlg.showModal()}catch(e){dlg.setAttribute('open','')} }
}
document.getElementById('rand').onclick=draw;
document.getElementById('again').onclick=draw;
document.getElementById('close').onclick=()=>{try{dlg.close()}catch(e){dlg.removeAttribute('open')}};
window.addEventListener('beforeprint',()=>grid.querySelectorAll('.card').forEach(ensureArt));
apply();
</script>
</body>
</html>
